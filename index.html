<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Arcade Hub</title>
  <meta name="description" content="Skill-based arcade games with cash and coin wagers." />
  <meta name="theme-color" content="#03060c" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Arcade Hub" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script defer src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/phaser@3.85.0/dist/phaser.min.js"></script>
  <script defer src="games/avoid-the-germs/avoid-the-germs.js"></script>
  <script defer src="main.js"></script>
  <script defer src="pwa-install.js"></script>
</head>
<body onunload="handleFlappyPageExit()" onvisibilitychange="handleFlappyPageExit()">
  <div id="app">
    <header class="topbar">
      <h1 class="logo">Arcade Hub</h1>
      <div class="header-auth-buttons">
        <div id="pwa-install-container"></div>
        <div id="auth-section"></div>
      </div>
    </header>

    <main id="main-content"></main>
    <div id="debug-panel" class="small-text" style="margin:0.5rem 1rem 1rem; color:#9ca3af;"></div>
  </div>
  <div id="auth-modal-root"></div>
</body>
</html>
